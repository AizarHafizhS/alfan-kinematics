# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    use_sim_time: true

    head_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    right_leg_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    left_leg_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

head_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - head_yaw
      - head_roll
    command_interfaces:
      - position
    state_interfaces:
      - position
      # - velocity
    allow_nonzero_velocity_at_trajectory_end: false

right_arm_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - r_hand_21
      - r_hand_22
      - r_hand_23
      - r_hand_24
      - r_hand_25
      - r_hand_26
    command_interfaces:
      - position
      # - velocity
    state_interfaces:
      - position
      # - velocity
    allow_nonzero_velocity_at_trajectory_end: false

left_arm_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - l_hand_31
      - l_hand_32
      - l_hand_33
      - l_hand_34
      - l_hand_35
      - l_hand_36
    command_interfaces:
      - position
      # - velocity
    state_interfaces:
      - position
      # - velocity
    allow_nonzero_velocity_at_trajectory_end: false

right_leg_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - r_hip_yaw
      - r_hip_roll
      - r_hip_pitch
      - r_knee
      - r_ankle_pitch
      - r_ankle_roll
    command_interfaces:
      - position
      # - velocity
    state_interfaces:
      - position
      # - velocity
    allow_nonzero_velocity_at_trajectory_end: false

left_leg_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - l_hip_yaw
      - l_hip_roll
      - l_hip_pitch
      - l_knee
      - l_ankle_pitch
      - l_ankle_roll
    command_interfaces:
      - position
      # - velocity
    state_interfaces:
      - position
      # - velocity
    allow_nonzero_velocity_at_trajectory_end: false

imu_broadcaster:
  ros__parameters:
    use_sim_time: true
    sensor_name: imu_sensor
    frame_id: body