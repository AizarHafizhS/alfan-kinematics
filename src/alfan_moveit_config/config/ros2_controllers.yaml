# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    head_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    right_leg_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    left_leg_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

head_controller:
  ros__parameters:
    joints:
      - head_yaw
      - head_roll
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
right_arm_controller:
  ros__parameters:
    joints:
      - r_hand_21
      - r_hand_22
      - r_hand_23
      - r_hand_24
      - r_hand_25
      - r_hand_26
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
left_arm_controller:
  ros__parameters:
    joints:
      - l_hand_31
      - l_hand_32
      - l_hand_33
      - l_hand_34
      - l_hand_35
      - l_hand_36
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
right_leg_controller:
  ros__parameters:
    joints:
      - r_hip_yaw
      - r_hip_roll
      - r_hip_pitch
      - r_knee
      - r_ankle_pitch
      - r_ankle_roll
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
left_leg_controller:
  ros__parameters:
    joints:
      - l_hip_yaw
      - l_hip_roll
      - l_hip_pitch
      - l_knee
      - l_ankle_pitch
      - l_ankle_roll
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity