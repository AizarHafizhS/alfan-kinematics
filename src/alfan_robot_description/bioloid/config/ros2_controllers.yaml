# Konfigurasi Controller khusus Bioloid Type A (Onshape Export)
controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    # head_controller:
      # type: position_controllers/JointGroupPositionController

    right_arm_controller:
      type: position_controllers/JointGroupPositionController

    left_arm_controller:
      type: position_controllers/JointGroupPositionController

    legs_controller:
      type: position_controllers/JointGroupPositionController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

right_arm_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - r_hand_roll
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: false

left_arm_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - l_hand_roll
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: false

legs_controller:
  ros__parameters:
    use_sim_time: true
    allow_partial_joints_goal: true
    joints:
      - r_hip_yaw
      - r_hip_roll
      - r_hip_pitch
      - r_knee
      - r_ankle_pitch
      - r_ankle_roll
      - l_hip_yaw
      - l_hip_roll
      - l_hip_pitch
      - l_knee
      - l_ankle_pitch
      - l_ankle_roll
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    # TAMBAHKAN GAINS DI BAWAH INI
    gains:
      r_hip_yaw: {p: 100.0, i: 0.1, d: 1.0}
      r_hip_roll: {p: 150.0, i: 0.1, d: 1.0}
      r_hip_pitch: {p: 150.0, i: 0.1, d: 1.0}
      r_knee: {p: 200.0, i: 0.1, d: 2.0} # Knee paling besar karena menahan beban zc
      r_ankle_pitch: {p: 150.0, i: 0.1, d: 1.0}
      r_ankle_roll: {p: 150.0, i: 0.1, d: 1.0}
      l_hip_yaw: {p: 100.0, i: 0.1, d: 1.0}
      l_hip_roll: {p: 150.0, i: 0.1, d: 1.0}
      l_hip_pitch: {p: 150.0, i: 0.1, d: 1.0}
      l_knee: {p: 200.0, i: 0.1, d: 2.0}
      l_ankle_pitch: {p: 150.0, i: 0.1, d: 1.0}
      l_ankle_roll: {p: 150.0, i: 0.1, d: 1.0}

imu_broadcaster:
  ros__parameters:
    use_sim_time: true
    sensor_name: imu_sensor
    frame_id: imu_link